


name: Debug Logging Lab

on:
  workflow_dispatch:

jobs:
  test-debugging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check application configuration
        run: |
          echo "::debug::Checking for application.conf"

          if [ -f application.conf ]; then
            echo "SUCCESS: Configuration file found"
          else
            echo "::error::Application configuration missing"
            exit 1
          fi


